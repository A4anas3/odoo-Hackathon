spring.application.name=hr
server.port=9000

# Exclude unconfigured vector store autoconfiguration
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration

# Datasource Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/hr_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:00889977}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Security & JWT Configuration
# In production, set JWK Set URI or HMAC secret for token verification:
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://<issuer>/.well-known/jwks.json
# spring.security.oauth2.resourceserver.jwt.secret=your-super-secret-key-at-least-32-bytes-long

# RabbitMQ Configuration
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.auto-startup=${SPRING_RABBITMQ_LISTENER_AUTOSTARTUP:true}
spring.rabbitmq.listener.simple.missing-queues-fatal=false

# Mail Server Configuration (Configurable via ENV, defaults to standard / Mailtrap / SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.ethereal.email}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:peoplepay360.payroll@ethereal.email}
spring.mail.password=${SPRING_MAIL_PASSWORD:payroll_secure_secret}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
payroll.mail.from=${PAYROLL_MAIL_FROM:payroll@peoplepay360.com}
payroll.mail.sender-name=${PAYROLL_MAIL_SENDER_NAME:PeoplePay360 HR & Payroll}

# HTTP Request Logging (Shows every incoming GET/POST/PUT request in terminal)
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.to-console=true
server.tomcat.accesslog.pattern=%t "%r" %s %b (%D ms)
logging.level.org.springframework.web=INFO
logging.level.com.odoo.hr=INFO

