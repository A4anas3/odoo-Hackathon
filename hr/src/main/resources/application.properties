spring.application.name=hr
server.port=9000

# Exclude unconfigured vector store autoconfiguration
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration

# Datasource Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/hr_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:00889977}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# Security & JWT Configuration
# In production, set JWK Set URI or HMAC secret for token verification:
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://<issuer>/.well-known/jwks.json
# spring.security.oauth2.resourceserver.jwt.secret=your-super-secret-key-at-least-32-bytes-long

# HTTP Request Logging (Shows every incoming GET/POST/PUT request in terminal)
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.to-console=true
server.tomcat.accesslog.pattern=%t "%r" %s %b (%D ms)
logging.level.org.springframework.web=INFO
logging.level.com.odoo.hr=INFO

