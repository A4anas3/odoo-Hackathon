# HTTP Request Logging (Shows every incoming GET/POST/PUT request in terminal)
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.to-console=true
server.tomcat.accesslog.pattern=%t "%r" %s %b (%D ms)
logging.level.org.springframework.web=INFO
logging.level.com.odoo.hr=INFO

# Redis Configuration
spring.data.redis.host=localhost
