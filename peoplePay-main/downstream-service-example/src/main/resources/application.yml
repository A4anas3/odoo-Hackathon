server:
  port: 8081

spring:
  application:
    name: downstream-service-example

app:
  jwt:
    # Only the PUBLIC key is ever needed here — this service can verify tokens but
    # can never mint them, since it doesn't have the private key.
    public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public_key.pem}
    issuer: ${JWT_ISSUER:auth-service}
